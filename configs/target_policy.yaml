target:
  target_name: high_severity_critical_inspection_outcome

  target_event_type:
    - "Cycle Inspection / Initial Inspection"

  positive_rule:
    field: critical_violation_count
    operator: ">="
    threshold: 3

  interpretation: >
    A target inspection is positive when the next eligible routine
    cycle-initial inspection contains three or more recorded critical
    violations. This is a project-defined operational severity threshold
    for retrospective inspection-prioritization evaluation; it is not an
    official closure threshold or a statement of current restaurant safety.

historical_events:
  - "Cycle Inspection / Initial Inspection"
  - "Cycle Inspection / Re-inspection"

excluded_from_target_and_primary_history: >
  All inspection types other than the two explicitly listed historical
  cycle-inspection types are excluded from the primary model.