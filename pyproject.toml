[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "restaurant-inspection-prioritization"
version = "0.1.0"
description = "Leakage-safe longitudinal modeling for NYC restaurant inspection prioritization."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.5",
    "joblib==1.5.3",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pyarrow==25.0.0",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "boto3==1.42.0",
]


[project.optional-dependencies]
test = [
    "pytest",
    "ruff",
    "httpx2",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[tool.ruff]
line-length = 88
target-version = "py312"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "RET",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"